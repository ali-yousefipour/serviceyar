name: Upload to service-yar.ir

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - '.github/workflows/deploy-serviceyar.yml'
      - 'tools/deploy_serviceyar.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceyar-production-deploy
  # Supersede stalled/obsolete deploy runs so the newest main revision reaches production.
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PHP and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, dom, mbstring, zlib, gd, exif
      - name: PHP syntax and static smoke tests
        shell: bash
        run: |
          set -euo pipefail
          find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/static-smoke.php
          php -r 'if (!extension_loaded("gd")) { fwrite(STDERR, "GD is required for school photos\\n"); exit(1); }'
          php tests/school-image-processing.php
          php tests/xlsx-writer.php
          php tests/sepand-xlsx.php
          php tests/excel-localization.php
          php tests/directory-sorting.php
          php tests/installments.php
          php tests/monthly-statement-period.php
          php tests/monthly-statement-template-capacity.php
          php tests/statement-reference-only.php
          php tests/monthly-statement-reference.php
          php tests/monthly-statement-template.php
          php tests/monthly-statement-preview-digest.php
          php tests/monthly-statement-installed-template.php
          php tests/inspect-reference-structure.php
          # Validate normalized UTF-8 table headers against worksheet headers.
          php tests/monthly-statement-render-smoke.php render > /tmp/serviceyar-statement-reference-test.xlsx
          php tests/monthly-statement-render-smoke.php verify /tmp/serviceyar-statement-reference-test.xlsx
          php tests/monthly-statement-render-smoke.php render-preview > /tmp/serviceyar-statement-preview-test.xlsx
          php tests/monthly-statement-render-smoke.php verify /tmp/serviceyar-statement-preview-test.xlsx
          php tests/monthly-statement-render-smoke.php render-large > /tmp/serviceyar-statement-large-test.xlsx
          # Verify dynamic student/driver ranges, footer rows and original reference print settings.
          php tests/monthly-statement-render-smoke.php verify /tmp/serviceyar-statement-large-test.xlsx --large
          rm /tmp/serviceyar-statement-large-test.xlsx
          rm /tmp/serviceyar-statement-preview-test.xlsx
          # Assert no Excel-repair shared formulas or stale period headings.
          rm /tmp/serviceyar-statement-reference-test.xlsx
          node --check frontend/assets/app.js
          node --check frontend/assets/public-site.js
          node tests/public-landing.mjs
          node tests/auth-screen-isolation.cjs
          node tests/login-username-normalization.cjs
          node tests/sepand-schema-ui.cjs
          node tests/deploy-staging.cjs
          test -f frontend/assets/public-site-content.html
          test -f frontend/assets/public-site.css
          node --check frontend/assets/task-progress.js
          node tests/task-progress.cjs
          node tests/ui-consistency.cjs
          node tests/filter-consistency.cjs
          node tests/local-map-assets.cjs
          python3 tests/vendor-neshan-sdk.py
          python3 -m py_compile tools/vendor_neshan_sdk.py
          node --check frontend/assets/operations.js
          node --check frontend/assets/bale-bot.js
          node --check frontend/assets/login-methods.js
          node tests/login-methods-contract.cjs
          node tests/negin-sms-admin-settings.cjs
          node tests/kavenegar-sms-contract.cjs
          php tests/kavenegar-sms.php
          node tests/representative-access-contract.cjs
          node tests/admin-impersonation-contract.cjs
          node tests/admin-driver-preview-contract.cjs
          node tests/portal-mobile-parent-representative-contract.cjs
          node tests/portal-company-design-parity.cjs
          node tests/portal-responsive-debtors-contract.cjs
          node tests/portal-driver-admin-edit-contract.cjs
          node tests/api-route-guard-contract.cjs
          node tests/payroll-reconciliation-contract.cjs
          node tests/taxi-tariff-footnotes-contract.cjs
          node tests/bale-integration-contract.cjs
          node tests/bale-anonymous-login.cjs
          node tests/bale-regular-user-link.cjs
          node --check frontend/assets/vehicle-class-admin.js
          node --check frontend/assets/vehicle-model-picker.js
          node tests/vehicle-model-selector.cjs
          node tests/wizard-lookup.cjs
          node tests/finance-form-inputs.cjs
          node tests/new-service-wizard.cjs
          node tests/journal-balance.cjs
          node tests/cheque-editor.cjs
          node tests/accounting-report-ui.cjs
          python3 -m py_compile tools/deploy_serviceyar.py
          node tests/solar-date.cjs
          test -s frontend/assets/app.css
          test -s frontend/assets/operations.css
          test -s frontend/assets/Vazirmatn-Regular.woff2
          test -s frontend/assets/favicon.svg

      - name: Dashboard contract and production JS parsing
        run: node tests/company-dashboard-contract.cjs
      - name: Taxi organization application, CSP and billing safeguards
        run: node tests/taxi-tariff-application-contract.cjs
      - name: Verified parent and driver portal security and UI contracts
        run: node tests/portal-access-contract.cjs
      - name: Official fare component unit test
        run: php tests/taxi-fare-components.php
          php tests/service-finance-basis.php
      - name: Financial quote integration (read-only fixture)
        run: php tests/taxi-financial-integration.php

  deploy:
    name: Upload ServiceYar to service-yar.ir
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public_html payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-payload
          mkdir -p deploy-payload/assets deploy-payload/backend deploy-payload/database deploy-payload/storage
          cp frontend/index.html deploy-payload/index.html
          cp frontend/portal.html deploy-payload/portal.html
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" deploy-payload/index.html deploy-payload/portal.html
          cp frontend/assets/* deploy-payload/assets/
          # Vendor SDK at build time: no external CDN fetch in the visitor's browser.
          python3 tools/vendor_neshan_sdk.py deploy-payload/assets/vendor/neshan/v1.0.8
          test -s deploy-payload/assets/vendor/neshan/v1.0.8/index.js
          test -s deploy-payload/assets/vendor/neshan/v1.0.8/index.css
          test -s deploy-payload/portal.html
          test -s deploy-payload/assets/portal.js
          test -s deploy-payload/assets/portal.css
          grep -Fq "location.replace('/#login')" deploy-payload/portal.html
          cp -a backend/. deploy-payload/backend/
          cp -a database/. deploy-payload/database/
          cp -a storage/. deploy-payload/storage/
          cat > deploy-payload/.htaccess <<'HTACCESS'
          Options -Indexes
          RewriteEngine On
          <IfModule mod_headers.c>
          Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.neshan.org; script-src 'self' https://static.neshan.org; connect-src 'self' https://*.neshan.org; style-src 'self' https://static.neshan.org; style-src-attr 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';"
          # Safe to cache: the local SDK path is pinned to v1.0.8.
          Header set Cache-Control "public, max-age=31536000, immutable" env=SY_NESHAN_SDK
          </IfModule>
          RewriteRule ^assets/vendor/neshan/v1\\.0\\.8/ - [E=SY_NESHAN_SDK:1]

          # Keep the public application on the canonical HTTPS apex domain.
          RewriteCond %{HTTP_HOST} ^www\.service-yar\.ir$ [NC]
          RewriteRule ^ https://service-yar.ir%{REQUEST_URI} [R=301,L,NE]
          RewriteCond %{HTTP_HOST} ^service-yar\.ir$ [NC]
          RewriteCond %{HTTPS} !=on
          RewriteRule ^ https://service-yar.ir%{REQUEST_URI} [R=301,L,NE]

          # Route API requests to the PHP front controller.
          RewriteRule ^api/?$ backend/public/index.php [QSA,L]
          RewriteRule ^api/.*$ backend/public/index.php [QSA,L]

          # Do not expose application internals, runtime data, or environment files.
          RewriteCond %{THE_REQUEST} \s/+backend(?:/|\s) [NC]
          RewriteRule ^backend(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+database(?:/|\s) [NC]
          RewriteRule ^database(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+storage(?:/|\s) [NC]
          RewriteRule ^storage(?:/|$) - [F,L,NC]
          <FilesMatch "^\.serviceyar-">
            Require all denied
          </FilesMatch>
          <FilesMatch "^\.env(?:\..*)?$">
            Require all denied
          </FilesMatch>
          <FilesMatch "\.(?:sql|log|ini|ya?ml|dist)$">
            Require all denied
          </FilesMatch>
          HTACCESS
          echo "Prepared files:"
          find deploy-payload -type f -print | sort
          test -f deploy-payload/index.html
          test -f deploy-payload/assets/app.js
          test -f deploy-payload/backend/public/index.php
          test -f deploy-payload/database/migrations/0001_create_migrations_table.sql
          # Release completeness: the latest dashboard AND the official fare
          # engine must be present in the final upload payload together.
          test -s deploy-payload/assets/vendor/neshan/v1.0.8/SHA256SUMS
          test -s deploy-payload/assets/operations.js
          test -s deploy-payload/assets/app.css
          test -s deploy-payload/assets/operations.css
          test -s deploy-payload/assets/ui-consistency.css
          test -s deploy-payload/backend/src/Domain/OperationsService.php
          test -s deploy-payload/backend/src/Domain/TaxiOrganizationTariffs.php
          test -s deploy-payload/backend/src/Domain/TaxiFareComponents.php
          test -s deploy-payload/backend/src/Domain/DriverDeductionPolicy.php
          grep -q 'sy-mgmt-dashboard' deploy-payload/assets/operations.js
          grep -q 'statusMismatch' deploy-payload/backend/src/Domain/OperationsService.php
          grep -q 'previewCoordinationAllocation' deploy-payload/backend/src/Domain/TaxiFareComponents.php
          grep -q "${GITHUB_SHA}" deploy-payload/index.html
          echo "Verified bundled dashboard and financial engine for release ${GITHUB_SHA}"

      - name: Stage, publish and verify hosting payload
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
          FTP_REMOTE_ROOT: /
          PUBLIC_BASE_URL: https://service-yar.ir
        run: python3 tools/deploy_serviceyar.py
