name: Deploy ServiceYar to Challi Hosting

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - '.github/workflows/deploy-serviceyar.yml'
      - 'tools/deploy_serviceyar.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceyar-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate PHP and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: PHP syntax and static smoke tests
        shell: bash
        run: |
          set -euo pipefail
          find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/static-smoke.php
          php tests/monthly-statement-period.php
          php tests/monthly-statement-reference.php
          node --check frontend/assets/app.js
          node --check frontend/assets/operations.js
          python3 -m py_compile tools/deploy_serviceyar.py
          node tests/solar-date.cjs
          test -s frontend/assets/app.css
          test -s frontend/assets/operations.css
          test -s frontend/assets/Vazirmatn-Regular.woff2
          test -s frontend/assets/favicon.svg

  deploy:
    name: Upload website into public_html
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public_html payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-payload
          mkdir -p deploy-payload/assets deploy-payload/backend deploy-payload/database deploy-payload/storage
          cp frontend/index.html deploy-payload/index.html
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" deploy-payload/index.html
          cp frontend/assets/* deploy-payload/assets/
          cp -a backend/. deploy-payload/backend/
          cp -a database/. deploy-payload/database/
          cp -a storage/. deploy-payload/storage/
          cat > deploy-payload/.htaccess <<'HTACCESS'
          Options -Indexes
          RewriteEngine On
          <IfModule mod_headers.c>
          Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.neshan.org; script-src 'self' https://static.neshan.org; connect-src 'self' https://*.neshan.org; style-src 'self' https://static.neshan.org; style-src-attr 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';"
          </IfModule>

          # Route API requests to the PHP front controller.
          RewriteRule ^api/?$ backend/public/index.php [QSA,L]
          RewriteRule ^api/.*$ backend/public/index.php [QSA,L]

          # Do not expose application internals, runtime data, or environment files.
          RewriteCond %{THE_REQUEST} \s/+backend(?:/|\s) [NC]
          RewriteRule ^backend(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+database(?:/|\s) [NC]
          RewriteRule ^database(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+storage(?:/|\s) [NC]
          RewriteRule ^storage(?:/|$) - [F,L,NC]
          <FilesMatch "^\.serviceyar-">
            Require all denied
          </FilesMatch>
          <FilesMatch "^\.env(?:\..*)?$">
            Require all denied
          </FilesMatch>
          <FilesMatch "\.(?:sql|log|ini|ya?ml|dist)$">
            Require all denied
          </FilesMatch>
          HTACCESS
          echo "Prepared files:"
          find deploy-payload -type f -print | sort
          test -f deploy-payload/index.html
          test -f deploy-payload/assets/app.js
          test -f deploy-payload/backend/public/index.php
          test -f deploy-payload/database/migrations/0001_create_migrations_table.sql

      - name: Stage, publish and verify hosting payload
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
        run: python3 tools/deploy_serviceyar.py
