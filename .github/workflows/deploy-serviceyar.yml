name: Deploy ServiceYar to Challi Hosting

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - '.github/workflows/deploy-serviceyar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serviceyar-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate PHP and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: PHP syntax and static smoke tests
        shell: bash
        run: |
          set -euo pipefail
          find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/static-smoke.php
          node --check frontend/assets/app.js
          test -s frontend/assets/app.css
          test -s frontend/assets/Vazirmatn-Regular.woff2
          test -s frontend/assets/favicon.svg

  deploy:
    name: Upload website into public_html
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare public_html payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-payload
          mkdir -p deploy-payload/assets deploy-payload/backend deploy-payload/database deploy-payload/storage
          cp frontend/index.html deploy-payload/index.html
          cp frontend/assets/* deploy-payload/assets/
          cp -a backend/. deploy-payload/backend/
          cp -a database/. deploy-payload/database/
          cp -a storage/. deploy-payload/storage/
          cat > deploy-payload/.htaccess <<'HTACCESS'
          Options -Indexes
          RewriteEngine On

          # Route API requests to the PHP front controller.
          RewriteRule ^api/?$ backend/public/index.php [QSA,L]
          RewriteRule ^api/.*$ backend/public/index.php [QSA,L]

          # Do not expose application internals, runtime data, or environment files.
          RewriteCond %{THE_REQUEST} \s/+backend(?:/|\s) [NC]
          RewriteRule ^backend(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+database(?:/|\s) [NC]
          RewriteRule ^database(?:/|$) - [F,L,NC]
          RewriteCond %{THE_REQUEST} \s/+storage(?:/|\s) [NC]
          RewriteRule ^storage(?:/|$) - [F,L,NC]
          <FilesMatch "^\.env(?:\..*)?$">
            Require all denied
          </FilesMatch>
          <FilesMatch "\.(?:sql|log|ini|ya?ml|dist)$">
            Require all denied
          </FilesMatch>
          HTACCESS
          echo "Prepared files:"
          find deploy-payload -type f -print | sort
          test -f deploy-payload/index.html
          test -f deploy-payload/assets/app.js
          test -f deploy-payload/backend/public/index.php
          test -f deploy-payload/database/migrations/0001_create_migrations_table.sql

      - name: Install lftp
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      # All files are first uploaded away from live paths. A failed FTP transfer
      # here leaves the currently served index/assets untouched.
      - name: Upload payload to isolated staging directory
        shell: bash
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
          STAGING_DIR: /public_html/.serviceyar-staging-${{ github.sha }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Add SERVICEYAR_FTP_HOST in repository Actions secrets}"
          : "${FTP_USER:?Add SERVICEYAR_FTP_USERNAME in repository Actions secrets}"
          : "${FTP_PASS:?Add SERVICEYAR_FTP_PASSWORD in repository Actions secrets}"
          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 2;
            set ssl:verify-certificate no;
            mkdir -p ${STAGING_DIR};
            bye
          "
          # Protect the staging directory from public HTTP access. Keep the real
          # production .htaccess under a different name until promotion.
          cat > /tmp/.htaccess <<'DENY'
          Require all denied
          DENY
          cp deploy-payload/.htaccess /tmp/.htaccess.new
          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 5;
            set ssl:verify-certificate no;
            put -O ${STAGING_DIR} /tmp/.htaccess;
            mirror --reverse --verbose --overwrite --no-perms --exclude-glob .htaccess deploy-payload/ ${STAGING_DIR}/;
            put -O ${STAGING_DIR} /tmp/.htaccess.new;
            bye
          "

      - name: Verify staged files before touching production
        shell: bash
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
          STAGING_DIR: /public_html/.serviceyar-staging-${{ github.sha }}
        run: |
          set -euo pipefail
          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set ssl:verify-certificate no;
            get ${STAGING_DIR}/index.html -o /tmp/serviceyar-staged-index.html;
            get ${STAGING_DIR}/.htaccess.new -o /tmp/serviceyar-staged-htaccess;
            get ${STAGING_DIR}/assets/app.js -o /tmp/serviceyar-staged-app.js;
            get ${STAGING_DIR}/assets/app.css -o /tmp/serviceyar-staged-css.css;
            get ${STAGING_DIR}/assets/Vazirmatn-Regular.woff2 -o /tmp/serviceyar-staged-font.woff2;
            get ${STAGING_DIR}/assets/favicon.svg -o /tmp/serviceyar-staged-favicon.svg;
            get ${STAGING_DIR}/backend/public/index.php -o /tmp/serviceyar-staged-index.php;
            bye
          "
          cmp deploy-payload/index.html /tmp/serviceyar-staged-index.html
          cmp deploy-payload/assets/app.js /tmp/serviceyar-staged-app.js
          cmp deploy-payload/assets/app.css /tmp/serviceyar-staged-css.css
          cmp deploy-payload/assets/Vazirmatn-Regular.woff2 /tmp/serviceyar-staged-font.woff2
          cmp deploy-payload/assets/favicon.svg /tmp/serviceyar-staged-favicon.svg
          cmp deploy-payload/backend/public/index.php /tmp/serviceyar-staged-index.php
          test "$(wc -c < /tmp/serviceyar-staged-font.woff2)" -gt 40000

      # Publish non-static application data only after staging verification.
      # Browser assets and index.html are promoted by same-host FTP rename;
      # index.html is promoted last after its referenced assets.
      - name: Promote verified payload
        shell: bash
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
          STAGING_DIR: /public_html/.serviceyar-staging-${{ github.sha }}
        run: |
          set -euo pipefail
          # The entire payload and all browser-critical assets were downloaded
          # from staging and byte-compared before this step. Publish application
          # directories only now; promote the static assets by FTP rename, and
          # replace index.html last.
          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set net:max-retries 5;
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            mkdir -p /public_html/assets;
            mirror --reverse --verbose --overwrite --no-perms ${STAGING_DIR}/backend/ /public_html/backend/;
            mirror --reverse --verbose --overwrite --no-perms ${STAGING_DIR}/database/ /public_html/database/;
            mirror --reverse --verbose --overwrite --no-perms ${STAGING_DIR}/storage/ /public_html/storage/;
            mv -f ${STAGING_DIR}/assets/app.js /public_html/assets/app.js;
            mv -f ${STAGING_DIR}/assets/app.css /public_html/assets/app.css;
            mv -f ${STAGING_DIR}/assets/Vazirmatn-Regular.woff2 /public_html/assets/Vazirmatn-Regular.woff2;
            mv -f ${STAGING_DIR}/assets/favicon.svg /public_html/assets/favicon.svg;
            mv -f ${STAGING_DIR}/.htaccess.new /public_html/.htaccess;
            mv -f ${STAGING_DIR}/index.html /public_html/index.html;
            bye
          "

      - name: Verify live files match repository
        shell: bash
        env:
          FTP_HOST: ${{ secrets.SERVICEYAR_FTP_HOST }}
          FTP_USER: ${{ secrets.SERVICEYAR_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.SERVICEYAR_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp --user "${FTP_USER}" --password "${FTP_PASS}" "ftp://${FTP_HOST}:21" -e "
            set ftp:ssl-force false;
            set ftp:ssl-protect-data false;
            set ftp:passive-mode true;
            set ftp:prefer-epsv false;
            set net:timeout 60;
            set ssl:verify-certificate no;
            get /public_html/index.html -o /tmp/serviceyar-live-index.html;
            get /public_html/assets/app.js -o /tmp/serviceyar-live-app.js;
            get /public_html/assets/app.css -o /tmp/serviceyar-live-css.css;
            get /public_html/assets/Vazirmatn-Regular.woff2 -o /tmp/serviceyar-live-font.woff2;
            get /public_html/assets/favicon.svg -o /tmp/serviceyar-live-favicon.svg;
            bye
          "
          cmp deploy-payload/index.html /tmp/serviceyar-live-index.html
          cmp frontend/assets/app.js /tmp/serviceyar-live-app.js
          cmp frontend/assets/app.css /tmp/serviceyar-live-css.css
          cmp frontend/assets/Vazirmatn-Regular.woff2 /tmp/serviceyar-live-font.woff2
          cmp frontend/assets/favicon.svg /tmp/serviceyar-live-favicon.svg
          test "$(wc -c < /tmp/serviceyar-live-font.woff2)" -gt 40000
