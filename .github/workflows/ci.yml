name: ServiceYar CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        shell: bash
        run: |
          set -e
          find backend tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/static-smoke.php
          php tests/xlsx-writer.php
          php tests/sepand-xlsx.php
          php tests/excel-localization.php
          php tests/directory-sorting.php
          php tests/student-distance-confirmation.php
          php tests/installments.php
          php tests/monthly-statement-period.php
          php tests/monthly-statement-template-capacity.php
          php tests/statement-reference-only.php
          node --check frontend/assets/app.js
          node --check frontend/assets/public-site.js
          node tests/public-landing.mjs
          node tests/auth-screen-isolation.cjs
          node tests/login-username-normalization.cjs
          node tests/sepand-schema-ui.cjs
          node --check frontend/assets/task-progress.js
          node tests/task-progress.cjs
          node tests/ui-consistency.cjs
          node tests/local-map-assets.cjs
          python3 tests/vendor-neshan-sdk.py
          python3 -m py_compile tools/vendor_neshan_sdk.py
          node --check frontend/assets/operations.js
          node tests/admin-impersonation-contract.cjs
          node tests/admin-driver-preview-contract.cjs
          node tests/portal-mobile-parent-representative-contract.cjs
          node tests/portal-company-design-parity.cjs
          node tests/portal-responsive-debtors-contract.cjs
          node tests/portal-driver-admin-edit-contract.cjs
          node tests/api-route-guard-contract.cjs
          node tests/payroll-reconciliation-contract.cjs
          node tests/taxi-tariff-footnotes-contract.cjs
          node tests/admin-production-schema-contract.cjs
          node --check frontend/assets/bale-bot.js
          node --check frontend/assets/login-methods.js
          node tests/login-methods-contract.cjs
          node tests/bale-integration-contract.cjs
          node tests/bale-anonymous-login.cjs
          node tests/bale-regular-user-link.cjs
          node --check frontend/assets/vehicle-class-admin.js
          node --check frontend/assets/vehicle-model-picker.js
          node tests/vehicle-model-selector.cjs
          node tests/wizard-lookup.cjs
          node tests/finance-form-inputs.cjs
          node tests/new-service-wizard.cjs
          node tests/journal-balance.cjs
          node tests/cheque-editor.cjs
          node tests/accounting-report-ui.cjs
          node --check frontend/assets/solar-date.js
          node tests/solar-date.cjs
          node tests/recent-contract-invoice-student-ui.cjs
      - name: Dashboard contract and production JS parsing
        run: node tests/company-dashboard-contract.cjs
      - name: Taxi organization application, CSP and billing safeguards
        run: node tests/taxi-tariff-application-contract.cjs
      - name: Verified parent and driver portal security and UI contracts
        run: node tests/portal-access-contract.cjs
      - name: Representative school access, dedicated role and account contracts
        run: node tests/representative-access-contract.cjs
      - name: Official fare component unit test
        run: |
          php tests/taxi-fare-components.php
          php tests/service-finance-basis.php
      - name: Financial quote integration (read-only fixture)
        run: php tests/taxi-financial-integration.php
  transport-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: serviceyar-local-test
          MARIADB_DATABASE: serviceyar_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: serviceyar_test
      DB_USERNAME: root
      DB_PASSWORD: serviceyar-local-test
      SERVICEYAR_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,zip,curl,soap,mbstring,zlib
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migration and transport integration
        run: |
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "PHP integration diagnostics:"; tail -100 storage/logs/serviceyar-error.log 2>/dev/null || true; fi' EXIT
          php backend/bin/migrate.php
          php backend/bin/migrate.php
          php tests/company-manager-authorization.php
          php tests/transport-integration.php
          php tests/seed-preview.php
      - name: HTTP contracts and CSRF
        run: |
          php -S 127.0.0.1:8080 backend/bin/dev-router.php > /tmp/serviceyar-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          node tests/api-integration.mjs
