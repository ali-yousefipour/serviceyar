name: Vehicle class effective-date regression

on:
  push:
    branches: [feature/vehicle-class-effective-dates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate source syntax
        run: |
          php -l backend/src/Domain/VehicleClassEffectiveDates.php
          php -l tests/vehicle-class-effective-dates.php
      - name: Check date and proration contracts
        run: php tests/vehicle-class-effective-dates.php
