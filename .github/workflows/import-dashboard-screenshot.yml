name: Install actual ServiceYar dashboard screenshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-dashboard-screenshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstitute verified dashboard image from uploaded asset chunks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p frontend/assets
          : > frontend/assets/dashboard-real-capture.webp
          for blob in 3dbc877b25141f37ab8a561c13851f243b02e603 3f3ad7ce8a35119be942d0afafe7494ecd56fe09; do
            curl --fail --silent --show-error --location --retry 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/git/blobs/$blob" \
              | python3 -c 'import json,sys,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              >> frontend/assets/dashboard-real-capture.webp
          done
          echo "a0f10798c6bb221db8374df39d8cb4e2b158075ba8897ad2b8c6acaf44ebd5f1  frontend/assets/dashboard-real-capture.webp" | sha256sum -c -
          file frontend/assets/dashboard-real-capture.webp
      - name: Commit permanent screenshot to public static assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/dashboard-real-capture.webp
          git commit -m "assets(public): add user-supplied real dashboard screenshot" || exit 0
          git push
