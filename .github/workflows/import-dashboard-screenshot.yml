name: Import actual ServiceYar dashboard screenshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-dashboard-screenshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the user's real dashboard capture
        env:
          ORIGINAL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:739/quality:100/uri:ifs%3A%2F%2FM%2F156fa096-541f-4daa-8882-8ccbf1163501/watermark:F/width:1440?csig=AAAAAAAAAAAAAAAAAAAAAKuhxhU7P14Su-1Gp86Brtb2qLHRLWqIZXtF1eqArZqP&exp=1794626086&osig=AAAAAAAAAAAAAAAAAAAAABt7ZAQiamrvGblzvqzYv4YQTRSa7lguxwCnHHC3hgu5&signer=media-rpc&token=AAIAAU0AJDE1NmZhMDk2LTU0MWYtNGRhYS04ODgyLThjY2JmMTE2MzUwMQAAAAABodgM5HAGW65QS7MoNLT3fT9GeVagXQaqw9ROqaNjroaiZNIgVw&x-canva-quality=thumbnail"
          THUMBNAIL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:102/quality:100/uri:ifs%3A%2F%2FM%2F156fa096-541f-4daa-8882-8ccbf1163501/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKuhxhU7P14Su-1Gp86Brtb2qLHRLWqIZXtF1eqArZqP&exp=1794626086&osig=AAAAAAAAAAAAAAAAAAAAABt7ZAQiamrvGblzvqzYv4YQTRSa7lguxwCnHHC3hgu5&signer=media-rpc&token=AAIAAU0AJDE1NmZhMDk2LTU0MWYtNGRhYS04ODgyLThjY2JmMTE2MzUwMQAAAAABodgM5HAGW65QS7MoNLT3fT9GeVagXQaqw9ROqaNjroaiZNIgVw&x-canva-quality=thumbnail"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/assets
          curl --fail --silent --show-error --location --retry 2 "$ORIGINAL_URL" --output /tmp/dashboard-image.png
          python3 - <<'PY'
          import struct
          data=open('/tmp/dashboard-image.png','rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Canva source was not a PNG'
          w,h=struct.unpack('>II',data[16:24])
          assert w >= 1000 and h >= 500, f'Full resolution download unavailable: {w}x{h}'
          print('Validated screenshot',w,h,'bytes:',len(data))
          PY
          cp /tmp/dashboard-image.png frontend/assets/dashboard-real-capture.png
      - name: Commit original screenshot to static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/dashboard-real-capture.png
          git commit -m "assets(public): add real dashboard screenshot" || exit 0
          git push
