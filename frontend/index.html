<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A327A"><title>سرویس‌یار</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="shell">
<section class="card">
  <div class="brand">سرویس‌یار</div>
  <h1>سامانه مدیریت سرویس مدارس</h1>
  <div id="loginView">
    <p>برای ورود، اطلاعات حساب کاربری را وارد کنید.</p>
    <form id="loginForm" class="form">
      <label>نام کاربری<input id="username" autocomplete="username" required></label>
      <label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">ورود</button>
      <div id="loginError" class="status error" hidden></div>
    </form>
  </div>
  <div id="appView" hidden>
    <div id="welcome" class="status ok"></div>
    <div class="actions"><button id="logout" type="button">خروج</button></div>
  </div>
  <div id="health" class="status">در حال بررسی وضعیت سرور...</div>
</section>
</main>
<script src="/assets/app.js" defer></script>
</body>
</html>
